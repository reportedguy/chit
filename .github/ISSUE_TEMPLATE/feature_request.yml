name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "When I dictate code comments, ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked ROADMAP.md and existing issues for this idea.
          required: true
        - label: This keeps Chit fully local (no cloud processing or telemetry).
          required: true
        - label: I'd like to help build this.
